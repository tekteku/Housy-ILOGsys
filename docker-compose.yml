# Docker Compose pour l'application Housy
# Orchestration complète avec services PostgreSQL, Redis et Application

services:  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: housy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: housy_tunisia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0000"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - housy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d housy_tunisia"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.housy.service=database"
      - "com.housy.environment=${NODE_ENV:-production}"

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: housy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - housy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      - "com.housy.service=cache"

  # Application Housy
  housy-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: housy-application
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Configuration de base
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0
        # Base de données
      DATABASE_URL: postgresql://postgres:0000@postgres:5432/housy_tunisia
      
      # Redis
      REDIS_URL: redis://redis:6379
      
      # API Keys (à configurer via .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      
      # Sécurité
      JWT_SECRET: ${JWT_SECRET:-HousyJWTSecret2025!ChangeThisInProduction}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      
      # Configuration CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      
      # Logs
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
    volumes:
      - ./server/data:/app/server/data:ro
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    networks:
      - housy-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.housy.service=application"
      - "com.housy.version=1.0.0"
      - "com.housy.environment=${NODE_ENV:-production}"
      - "traefik.enable=true"
      - "traefik.http.routers.housy.rule=Host(`housy.local`)"
      - "traefik.http.routers.housy.entrypoints=web"

  # Monitoring avec Prometheus (optionnel)
  prometheus:
    image: prom/prometheus:latest
    container_name: housy-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - housy-network
    profiles:
      - monitoring
    labels:
      - "com.housy.service=monitoring"

  # Visualisation avec Grafana (optionnel)
  grafana:
    image: grafana/grafana:latest
    container_name: housy-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - housy-network
    profiles:
      - monitoring
    labels:
      - "com.housy.service=visualization"

# Volumes persistants
volumes:
  postgres_data:
    driver: local
    labels:
      - "com.housy.volume=database"
  redis_data:
    driver: local
    labels:
      - "com.housy.volume=cache"
  app_logs:
    driver: local
    labels:
      - "com.housy.volume=logs"
  app_uploads:
    driver: local
    labels:
      - "com.housy.volume=uploads"
  prometheus_data:
    driver: local
    labels:
      - "com.housy.volume=monitoring"
  grafana_data:
    driver: local
    labels:
      - "com.housy.volume=visualization"

# Réseau isolé
networks:
  housy-network:
    driver: bridge
    labels:
      - "com.housy.network=internal"
